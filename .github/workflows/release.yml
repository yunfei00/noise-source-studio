name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Verify and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project, test and build dependencies
        run: python -m pip install -e ".[dev]" pyinstaller

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest

      - name: Import smoke test
        run: python -c "import noise_source_studio; print('noise_source_studio import OK')"

      - name: Build Windows executable
        shell: pwsh
        run: pyinstaller --noconfirm --clean --windowed --onedir --name NoiseSourceStudio --add-data "src/noise_source_studio/presentation/styles;noise_source_studio/presentation/styles" --add-data "src/noise_source_studio/presentation/icons;noise_source_studio/presentation/icons" --collect-all PySide6 --collect-all pyqtgraph --collect-all platformdirs --collect-all pydantic --collect-all pydantic_settings --collect-all packaging src/noise_source_studio/__main__.py

      - name: Verify executable exists
        shell: pwsh
        run: if (-not (Test-Path "dist/NoiseSourceStudio/NoiseSourceStudio.exe")) { throw "NoiseSourceStudio.exe was not generated" }

      - name: Package Windows x64 release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $archive = "NoiseSourceStudio-$tag-windows-x64.zip"
          Compress-Archive -Path "dist/NoiseSourceStudio/*" -DestinationPath $archive -Force
          Get-FileHash $archive -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $archive" | Out-File -Encoding ascii "$archive.sha256" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoiseSourceStudio-${{ github.ref_name }}-windows-x64
          path: |
            NoiseSourceStudio-${{ github.ref_name }}-windows-x64.zip
            NoiseSourceStudio-${{ github.ref_name }}-windows-x64.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: NoiseSourceStudio-${{ github.ref_name }}-windows-x64

      - name: Create GitHub Release with Windows package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release create "$TAG_NAME" NoiseSourceStudio-"$TAG_NAME"-windows-x64.zip NoiseSourceStudio-"$TAG_NAME"-windows-x64.zip.sha256 --repo "$REPOSITORY" --title "Noise Source Studio $TAG_NAME" --generate-notes --verify-tag
